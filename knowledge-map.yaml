# Site metadata for the 41 production-pattern lessons.
#
# Read by TikTzuki/scripts/sync-knowledge.sh, which INJECTS this as Docusaurus front
# matter into its copy of each lesson at build time. The lesson files themselves stay
# clean plain markdown with no front matter, because:
#
#   - production-review/SKILL.md links all 41 by RELATIVE path and the plugin resolves
#     them through ${CLAUDE_PLUGIN_ROOT}; the files' content and location are load-bearing
#     for anyone who installs from the marketplace.
#   - 347 relative links run between these files, 100 of them crossing a set boundary,
#     so the "sets" are a graph, not a folder structure. They are tags, not directories.
#
# `group` drives the sidebar sub-grouping built in TikTzuki/tik_space/sidebars.ts, so the
# seven sets show up as seven sidebar groups without a single file moving.
#
# Tags must exist in TikTzuki/tik_space/docs/tags.yml or the site build fails.

groups:
  runtime: Backend runtime
  storage: Storage & databases
  transactions: Transactions & consistency
  data-modeling: Data modeling
  api-design: API design
  distributed-systems: Distributed systems
  payments: Payments

