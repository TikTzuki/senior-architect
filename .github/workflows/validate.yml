name: Validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate marketplace and plugin manifests
        run: python3 scripts/validate-marketplace.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p vibe-generate --locked
